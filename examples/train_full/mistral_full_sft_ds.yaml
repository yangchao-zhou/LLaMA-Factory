# template: mistral_small_npc
template: mistral_small
cutoff_len: 8192
max_samples: 1000000000000
overwrite_cache: true
preprocessing_num_workers: 120


### output
output_dir: saves/full/mistral-24B-base-sft-AIME_gpqa-diamond_HLE_usamo_20250404
logging_steps: 1
# save_steps: 100
save_strategy: epoch
save_total_limit: 3
plot_loss: true
# overwrite_output_dir: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 3.0e-6
num_train_epochs: 5.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
# warmup_steps: 50
bf16: true
ddp_timeout: 180000000
flash_attn: fa2
