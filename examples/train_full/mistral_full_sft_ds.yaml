### model
# model_name_or_path: /maindata/data/shared/ai_story_workspace-dsw/nlp_models/mistralai/Mistral-Small-24B-Instruct-2501
model_name_or_path: /maindata/data/shared/public/yangchao.zhou/models/mistralai/Mistral-Small-24B-Base-2501
# model_name_or_path: /maindata/data/shared/public/yangchao.zhou/models/mistralai/Mistral-Nemo-Base-2407
### method
stage: sft
do_train: true
finetuning_type: full
# finetuning_type: freeze
# freeze_trainable_layers: 20
# freeze_trainable_modules: all
deepspeed: examples/deepspeed/ds_z3_offload_config.json

### dataset linky_score_20250221,
# dataset: tulu_alpaca_percent5,deepseek_7_9_6875,role_play_combined_data_202500304_3,score_train_data_20250304,lima,generate_role_play_data_20250304_过采样_3
dataset: lima,generate_role_play_data_20250304_过采样_3
# template: mistral_small_npc
template: mistral_small
cutoff_len: 8192
max_samples: 1000000000000
overwrite_cache: true
preprocessing_num_workers: 120


### output
output_dir: saves/full/sft-20250310-role_play-generate-lima-24B
logging_steps: 1
# save_steps: 100
save_strategy: epoch
save_total_limit: 10
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 2
learning_rate: 3.0e-6
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
# warmup_steps: 50
bf16: true
ddp_timeout: 180000000
flash_attn: fa2
# resume_from_checkpoint: true

