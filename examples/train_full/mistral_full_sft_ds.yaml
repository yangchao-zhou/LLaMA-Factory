model_name_or_path: /maindata/data/shared/public/yangchao.zhou/models/mistralai/Mistral-Small-24B-Base-2501
### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z3_offload_config.json

### dataset linky_score_20250221,
dataset: tulu_alpaca_percent5,deepseek_7_9_6875,role_play_combined_data_20250221_3,score_train_data_20250227
template: mistral
cutoff_len: 8192
max_samples: 1000000000000
overwrite_cache: true
preprocessing_num_workers: 64


### output
output_dir: saves/mistral-24b-linky/full/sft-20250228-tulu_deepseek_score_role_play-longCOT 
logging_steps: 1
save_steps: 200
# save_strategy: epoch
save_total_limit: 4
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 2
learning_rate: 5.0e-6
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
